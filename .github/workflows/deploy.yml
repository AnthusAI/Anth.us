name: Verify Gatsby build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Amplify deploys `main`; this workflow is a non-deploying build check.
concurrency:
  group: verify-gatsby-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout site repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Restore Gatsby cache
      uses: actions/cache@v4
      with:
        path: |
          .cache
          public
        key: gatsby-site-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          gatsby-site-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          gatsby-site-${{ runner.os }}-

    - name: Install dependencies
      run: npm ci

    - name: Build Gatsby site
      run: npm run build
      env:
        CI: true

    - name: Normalize and verify embedded global CSS
      run: node scripts/normalize-gatsby-inline-css.cjs

    - name: Verify rendered posts match cached query data
      run: node scripts/verify-gatsby-posts-cache.cjs

    - name: Save Gatsby cache
      if: success()
      uses: actions/cache@v4
      with:
        path: |
          .cache
          public
        key: gatsby-site-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
