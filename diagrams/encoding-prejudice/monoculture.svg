m&#39;s</tspan><tspan x="624" dy="20.5">hiring screen</tspan></text></g><g class="ZnJhbWUucmFua2luZ190b29s"><g class="shape" ><rect x="339" y="435" width="143" height="86" stroke="#8a949c" fill="#ffffff" style="stroke-width:2;" /></g><text x="410.5" y="477.5" fill="#333333" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="410.5" dy="0">A recruiter&#39;s</tspan><tspan x="410.5" dy="20.5">ranking tool</tspan></text></g><g class="ZnJhbWUuZGlyZWN0b3J5"><g class="shape" ><rect x="88" y="435" width="191" height="86" stroke="#8a949c" fill="#ffffff" style="stroke-width:2;" /></g><text x="183.5" y="477.5" fill="#333333" class="text-bold" style="text-anchor:middle;font-size:20px"><tspan x="183.5" dy="0">A bar association&#39;s</tspan><tspan x="183.5" dy="20.5">directory</tspan></text></g><g class="ZnJhbWUubW9kZWw="><g class="shape" ><path d="M 417 621 L 316 690 L 417 759 L 618 759 L 718 690 L 618 621 Z" stroke="#d03382" fill="#f6d7e6" style="stroke-width:3;" /></g><text x="517" y="678.5" fill="#333333" class="text-bold" style="text-anchor:middle;font-size:22px"><tspan x="517" dy="0">One rented model:</tspan><tspan x="517" dy="22.333333">same weights, same answer,</tspan><tspan x="517" dy="22.333333">same mistake</tspan></text></g><g class="ZnJhbWUuKHRpdGxlIC0mZ3Q7IHBlcnNvbilbMF0=" style='opacity:0'><marker id="mk-d2-2932665254-3827339744" markerWidth="10" markerHeight="12" refX="10" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="0" /> </marker><path d="M 517 92 C 517 131 517 151 517 189.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:0;" marker-end="url(#mk-d2-2932665254-3827339744)" mask="url(#d2-2932665254)" /></g><g class="ZnJhbWUuKHBlcnNvbiAtJmd0OyBmaXJtX2EpWzBd"><marker id="mk-d2-2932665254-3300360537" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userS