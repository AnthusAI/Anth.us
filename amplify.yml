version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - .cache/**/*
      # Gatsby's development webpack cache can grow past Amplify's 5 GB cache limit.
      # Rebuilding it costs seconds; preserving Gatsby data and generated assets saves minutes.
      - "!.cache/webpack/**/*"
      - public/**/*
      - .npm/**/*
