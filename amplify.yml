version: 1
env:
  variables:
    # Amplify's Standard build machine has four vCPUs; Gatsby otherwise defaults
    # to a smaller physical-core count when generating static image derivatives.
    GATSBY_CPU_COUNT: "4"
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - .cache/**/*
      # Gatsby's development webpack cache can grow past Amplify's 5 GB cache limit.
      # Rebuilding it costs seconds; preserving Gatsby data and generated assets saves minutes.
      - "!.cache/webpack/**/*"
      - public/**/*
      - .npm/**/*
